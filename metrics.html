<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrainLog Metrics">
<meta name="theme-color" content="#1B2320">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>TrainLog &middot; Body Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root{
    color-scheme: dark;
    --ink:#1B2320; --surface:#212B27; --surface2:#283330; --chalk:#EDE6D6; --iron:#8A9490;
    --amber:#E4A93A; --amber-fg:#E4A93A; --on-accent:#1B2320; --run:#C1502E; --line:rgba(237,230,214,0.10);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --ink:#F3EFE3; --surface:#FFFFFF; --surface2:#ECE5D5; --chalk:#26261F; --iron:#6E6E5F;
    --amber-fg:#9C6A0E; --line:rgba(38,38,31,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--chalk);}
  body{font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:calc(48px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  ::selection{background:var(--amber);color:var(--on-accent);}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}

  @keyframes pulseAnim{0%{transform:scale(1);}30%{transform:scale(0.96);}65%{transform:scale(1.025);}100%{transform:scale(1);}}
  .pulse{animation:pulseAnim 0.32s ease;}

  header.scoreboard{
    padding:calc(28px + env(safe-area-inset-top)) 20px 22px;
    background:radial-gradient(circle at 15% 0%, rgba(228,169,58,0.10), transparent 55%), var(--surface);
    border-bottom:1px solid var(--line); position:relative; overflow:hidden;
  }
  header.scoreboard::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--amber) 0 14px, transparent 14px 26px); opacity:0.5;
  }
  .brand{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .brand h1{font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:0.03em; margin:0; line-height:1;}
  .brand h1 span{color:var(--amber-fg);}
  .brand .sub{font-size:11px; color:var(--iron); text-transform:uppercase; letter-spacing:0.14em;}
  .nav-row{display:flex; gap:8px; flex-wrap:wrap;}
  .nav-link{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:0.05em; color:var(--amber-fg); text-decoration:none; border:1px solid var(--line);
    padding:7px 11px; border-radius:8px; background:var(--surface2);
  }
  .theme-toggle{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--iron); border:1px solid var(--line); padding:7px 11px; border-radius:8px;
    background:var(--surface2); cursor:pointer;
  }

  main{padding:20px; max-width:560px; margin:0 auto;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:22px; overflow:hidden;}
  .card h2{font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.04em; margin:0 0 14px; color:var(--chalk);}

  .collapsible-head{cursor:pointer; display:flex; align-items:center; justify-content:space-between;}
  .collapsible-head .chevron{font-size:12px; color:var(--iron); transition:transform 0.2s; display:inline-block;}
  .collapsible-head.is-collapsed .chevron{transform:rotate(-90deg);}
  .collapsible-head.is-collapsed{margin-bottom:0;}

  .editing-banner{
    background:rgba(228,169,58,0.12); border:1px solid var(--amber); border-radius:8px; padding:9px 12px;
    margin-bottom:12px; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; color:var(--chalk);
  }
  .editing-banner button{background:none; border:none; color:var(--amber-fg); text-decoration:underline; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif;}

  .field-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:10px;}
  @media (min-width:480px){ .field-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);} }
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field label{font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--iron);}
  .field input, .field textarea{
    background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--chalk);
    font-family:'Inter',sans-serif; font-size:14.5px; padding:9px 10px; outline:none; width:100%; min-width:0;
  }
  .field input:focus, .field textarea:focus{border-color:var(--amber);}
  .dist-row{display:flex; gap:8px;}
  .dist-row input{flex:1; min-width:0;}
  .unit-toggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:0 0 auto;}
  .unit-toggle button{background:var(--surface2); color:var(--iron); border:none; padding:0 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;}
  .unit-toggle button.active{background:var(--amber); color:var(--on-accent); font-weight:600;}
  textarea{resize:vertical; min-height:44px; margin-bottom:14px;}

  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:9px; cursor:pointer; background:var(--amber);
    color:var(--on-accent); font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.06em;
  }
  .btn-primary:active{transform:scale(0.99);}

  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 12px; border-radius:8px; border:1.5px solid var(--line);
    background:transparent; color:var(--iron); font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; font-weight:600; letter-spacing:0.05em; cursor:pointer;
  }
  .chip.active{background:var(--amber); color:var(--on-accent); border-color:transparent;}

  .progress-stats{display:flex; gap:8px; margin:0 0 16px;}
  .pstat{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:9px 6px; text-align:center;}
  .pstat .num{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; color:var(--chalk);}
  .pstat .lbl{font-size:8.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--iron); margin-top:3px;}
  .chart-wrap{position:relative; height:190px; margin-top:4px;}
  .progress-empty{text-align:center; padding:26px 12px; color:var(--iron); font-size:13px; border:1px dashed var(--line); border-radius:10px;}

  .log h2{font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.04em; margin:0 0 12px;}
  .day-group{margin-bottom:18px;}
  .day-head{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--iron); text-transform:uppercase; margin-bottom:8px; padding-left:2px;}
  .entry{position:relative; display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px 12px 16px; margin-bottom:8px; border-left:3px dashed var(--amber);}
  .entry::before, .entry::after{content:""; position:absolute; left:-1px; width:10px; height:10px; background:var(--ink); border-radius:50%; border:1px solid var(--line);}
  .entry::before{top:-6px;} .entry::after{bottom:-6px;}
  .entry-main{flex:1; min-width:0;}
  .entry-main .top-line{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .entry-main .dur{font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600;}
  .entry-main .sub-metric{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--iron);}
  .entry-main .note{font-size:12.5px; color:var(--iron); margin-top:2px; overflow-wrap:anywhere;}

  .entry-actions{position:relative; flex:0 0 auto;}
  .kebab-btn{background:none; border:none; color:var(--iron); font-size:19px; cursor:pointer; padding:4px 9px; line-height:1;}
  .kebab-btn:active{color:var(--chalk);}
  .entry-menu{position:absolute; right:0; top:30px; background:var(--surface2); border:1px solid var(--line); border-radius:9px; overflow:hidden; z-index:10; min-width:130px; box-shadow:0 6px 18px rgba(0,0,0,0.4);}
  .entry-menu button{display:block; width:100%; text-align:left; padding:11px 14px; background:none; border:none; color:var(--chalk); font-size:13px; font-family:'Inter',sans-serif; cursor:pointer;}
  .entry-menu button.danger{color:var(--run);}
  .entry-menu button:active{background:rgba(237,230,214,0.08);}

  .empty{text-align:center; padding:34px 18px; color:var(--iron); font-size:13.5px; border:1px dashed var(--line); border-radius:12px;}
  .empty .display{display:block; font-size:22px; color:var(--chalk); margin-bottom:6px;}

  footer{text-align:center; padding:18px 20px 6px; font-size:11px; color:var(--iron);}
  footer .foot-links{margin-bottom:8px;}
  footer button{background:none; border:none; color:var(--iron); text-decoration:underline; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif; padding:0 2px;}
  .foot-pref{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .foot-pref span{font-size:11px; color:var(--iron);}
  .foot-pref .unit-toggle button{text-decoration:none;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--chalk); color:var(--ink); padding:9px 16px; border-radius:20px; font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity 0.25s; z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="scoreboard">
  <div class="brand">
    <h1>BODY <span>METRICS</span></h1>
    <div class="sub">tracked over time</div>
  </div>
  <div class="nav-row">
    <a class="nav-link" href="index.html">&larr; BACK TO TRAINLOG</a>
    <button class="theme-toggle" id="themeToggle">&#127769; Dark</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>Log your stats</h2>
    <div class="editing-banner" id="editingBanner" style="display:none;">
      <span>Editing entry</span>
      <button id="cancelEditBtn">Cancel</button>
    </div>
    <div class="field-grid">
      <div class="field">
        <label for="mDate">Date</label>
        <input type="date" id="mDate">
      </div>
      <div class="field">
        <label>Weight (optional)</label>
        <div class="dist-row">
          <input type="number" id="mWeight" min="0" step="0.1" placeholder="e.g. 165">
          <div class="unit-toggle">
            <button type="button" id="unitLb" class="active">lb</button>
            <button type="button" id="unitKg">kg</button>
          </div>
        </div>
      </div>
    </div>
    <div class="field-grid">
      <div class="field">
        <label for="mBodyFat">Body fat % (optional)</label>
        <input type="number" id="mBodyFat" min="0" step="0.1" placeholder="e.g. 18.5">
      </div>
      <div class="field">
        <label for="mRHR">Resting HR bpm (optional)</label>
        <input type="number" id="mRHR" min="0" step="1" placeholder="e.g. 58">
      </div>
    </div>
    <div class="field">
      <label for="mNotes">Notes (optional)</label>
      <textarea id="mNotes" placeholder="How you're feeling, sleep, anything else..."></textarea>
    </div>
    <button class="btn-primary" id="submitBtn">LOG IT</button>
  </section>

  <section class="card">
    <h2>Progress</h2>
    <div class="chip-row" id="metricChips"></div>
    <div id="metricBody"></div>
  </section>

  <section class="card collapsible" data-section="correlate">
    <h2 class="collapsible-head" id="correlateHead">Correlate with training <span class="chevron">&#9662;</span></h2>
    <div class="collapsible-body" id="correlateBodyWrap">
      <div class="chip-row" id="correlateChips"></div>
      <div id="correlateBody"></div>
    </div>
  </section>

  <section class="log">
    <h2>History</h2>
    <div id="metricList"></div>
  </section>
</main>

<footer>
  <div class="foot-links">
    <button id="clearAllBtn">Clear all metrics data</button>
  </div>
  <div class="foot-pref">
    <span>Default weight unit:</span>
    <div class="unit-toggle">
      <button type="button" id="prefLb">lb</button>
      <button type="button" id="prefKg">kg</button>
    </div>
  </div>
  <div>Data is saved in this browser only. Full backups are available from the main TrainLog page.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
const METRICS = [
  {key:'weight',   label:'Weight',    getUnit:e=>e.weightUnit||'lb'},
  {key:'bodyFat',  label:'Body Fat',  getUnit:()=>'%'},
  {key:'restingHR',label:'Resting HR',getUnit:()=>'bpm'}
];

let metrics = [];
let activityEntries = [];
let selectedMetric = 'weight';
let selectedCorrelate = 'weight';
let metricChart = null;
let correlateChart = null;
let openMenuId = null;
let editingId = null;
let selectedWeightUnit = 'lb';
let collapsedSections = {correlate:true};

const $ = id => document.getElementById(id);

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(err){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(err){ return false; }
}

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function hapticPulse(el){
  if('vibrate' in navigator){ try{ navigator.vibrate(15); }catch(err){} }
  if(el){
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay()+6)%7;
  date.setDate(date.getDate()-day);
  date.setHours(0,0,0,0);
  return date;
}

/* ---------- Collapsible sections ---------- */
function applyCollapseState(){
  document.querySelectorAll('.collapsible').forEach(sec=>{
    const key = sec.dataset.section;
    const body = sec.querySelector('.collapsible-body');
    const head = sec.querySelector('.collapsible-head');
    const isCollapsed = !!collapsedSections[key];
    if(body) body.style.display = isCollapsed ? 'none' : '';
    if(head) head.classList.toggle('is-collapsed', isCollapsed);
  });
}
function toggleSection(key){
  collapsedSections[key] = !collapsedSections[key];
  saveJSON('trainlog_metrics_collapsed', collapsedSections);
  applyCollapseState();
}
document.querySelectorAll('.collapsible-head').forEach(head=>{
  head.addEventListener('click', ()=> toggleSection(head.closest('.collapsible').dataset.section));
});

/* ---------- Progress ---------- */
function renderMetricChips(){
  const row = $('metricChips');
  row.innerHTML = '';
  METRICS.forEach(m=>{
    const has = metrics.some(e=> e[m.key]!==null && e[m.key]!==undefined && e[m.key]!=='');
    if(!has && m.key!=='weight') return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (m.key===selectedMetric ? ' active' : '');
    b.textContent = m.label;
    b.onclick = ()=>{ selectedMetric = m.key; renderMetricProgress(); };
    row.appendChild(b);
  });
}

function renderMetricProgress(){
  renderMetricChips();
  const body = $('metricBody');
  const m = METRICS.find(x=>x.key===selectedMetric);
  const list = metrics
    .filter(e=> e[selectedMetric]!==null && e[selectedMetric]!==undefined && e[selectedMetric]!=='')
    .sort((a,b)=> a.date.localeCompare(b.date) || a.createdAt - b.createdAt);

  if(metricChart){ metricChart.destroy(); metricChart = null; }

  if(list.length===0){
    body.innerHTML = '<div class="progress-empty">No ' + m.label.toLowerCase() + ' entries logged yet.</div>';
    return;
  }

  const values = list.map(e=> Number(e[selectedMetric]));
  const latest = values[values.length-1];
  const first = values[0];
  const change = latest - first;
  const avg = values.reduce((a,b)=>a+b,0) / values.length;
  const unit = m.getUnit(list[list.length-1]);

  body.innerHTML = `
    <div class="progress-stats">
      <div class="pstat"><div class="num">${latest.toFixed(1)}</div><div class="lbl">Latest ${unit}</div></div>
      <div class="pstat"><div class="num">${change>=0?'+':''}${change.toFixed(1)}</div><div class="lbl">Change all-time</div></div>
      <div class="pstat"><div class="num">${avg.toFixed(1)}</div><div class="lbl">Average</div></div>
    </div>
    <div class="chart-wrap"><canvas id="metricCanvas"></canvas></div>
  `;

  const labels = list.map(e=> new Date(e.date+'T00:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric'}));
  const ctxEl = document.getElementById('metricCanvas');
  const rootStyle = getComputedStyle(document.documentElement);
  const ironColor = rootStyle.getPropertyValue('--iron').trim();
  const gridColor = rootStyle.getPropertyValue('--line').trim();
  const amberFg = rootStyle.getPropertyValue('--amber-fg').trim();

  metricChart = new Chart(ctxEl, {
    type:'line',
    data:{
      labels,
      datasets:[{
        label: m.label + ' (' + unit + ')',
        data: values,
        borderColor:amberFg,
        backgroundColor:amberFg + '26',
        fill:true,
        tension:0.3,
        pointRadius:3
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ ticks:{ color:ironColor, font:{family:'IBM Plex Mono', size:10} }, grid:{ color:gridColor } },
        y:{ ticks:{ color:ironColor, font:{family:'IBM Plex Mono', size:10} }, grid:{ color:gridColor } }
      }
    }
  });
}

/* ---------- Correlate with training ---------- */
function renderCorrelateChips(){
  const row = $('correlateChips');
  row.innerHTML = '';
  METRICS.forEach(m=>{
    const has = metrics.some(e=> e[m.key]!==null && e[m.key]!==undefined && e[m.key]!=='');
    if(!has) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (m.key===selectedCorrelate ? ' active' : '');
    b.textContent = m.label;
    b.onclick = ()=>{ selectedCorrelate = m.key; renderCorrelate(); };
    row.appendChild(b);
  });
}

function renderCorrelate(){
  renderCorrelateChips();
  const body = $('correlateBody');
  const m = METRICS.find(x=>x.key===selectedCorrelate);

  if(correlateChart){ correlateChart.destroy(); correlateChart = null; }

  const hasMetric = metrics.some(e=> e[selectedCorrelate]!==null && e[selectedCorrelate]!==undefined && e[selectedCorrelate]!=='');
  if(!hasMetric || activityEntries.length===0){
    body.innerHTML = '<div class="progress-empty">Log both training sessions and ' + m.label.toLowerCase() + ' entries to see how they relate.</div>';
    return;
  }

  const weeksToShow = 12;
  const today = new Date(todayStr()+'T00:00:00');
  const thisWeekStart = startOfWeek(today);
  const weekStarts = [];
  for(let i=weeksToShow-1; i>=0; i--){
    const ws = new Date(thisWeekStart);
    ws.setDate(ws.getDate() - i*7);
    weekStarts.push(ws);
  }

  const labels = [];
  const trainingMins = [];
  const metricAvgs = [];

  weekStarts.forEach(ws=>{
    const we = new Date(ws); we.setDate(we.getDate()+6);
    labels.push(ws.toLocaleDateString('en-US',{month:'short', day:'numeric'}));

    const mins = activityEntries.filter(e=>{
      const d = new Date(e.date+'T00:00:00');
      return d>=ws && d<=we;
    }).reduce((s,e)=> s + (Number(e.duration)||0), 0);
    trainingMins.push(mins);

    const vals = metrics.filter(e=>{
      if(e[selectedCorrelate]===null || e[selectedCorrelate]===undefined || e[selectedCorrelate]==='') return false;
      const d = new Date(e.date+'T00:00:00');
      return d>=ws && d<=we;
    }).map(e=> Number(e[selectedCorrelate]));
    metricAvgs.push(vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null);
  });

  const unit = m.getUnit(metrics.find(e=> e[selectedCorrelate]!==null && e[selectedCorrelate]!==undefined && e[selectedCorrelate]!=='') || {});

  body.innerHTML = '<div class="chart-wrap"><canvas id="correlateCanvas"></canvas></div>';
  const ctxEl = document.getElementById('correlateCanvas');
  const rootStyle = getComputedStyle(document.documentElement);
  const ironColor = rootStyle.getPropertyValue('--iron').trim();
  const gridColor = rootStyle.getPropertyValue('--line').trim();
  const amberFg = rootStyle.getPropertyValue('--amber-fg').trim();
  const barColor = ironColor + '55';

  correlateChart = new Chart(ctxEl, {
    data:{
      labels,
      datasets:[
        {
          type:'bar', label:'Training (min/wk)', data:trainingMins,
          backgroundColor: barColor,
          yAxisID:'y', borderRadius:4, maxBarThickness:22, order:2
        },
        {
          type:'line', label:m.label + ' (' + unit + ')', data:metricAvgs,
          borderColor:amberFg, backgroundColor:amberFg, yAxisID:'y1',
          tension:0.3, spanGaps:true, pointRadius:3, order:1
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:true, labels:{ color:ironColor, font:{family:'IBM Plex Mono', size:10} } } },
      scales:{
        x:{ ticks:{ color:ironColor, font:{family:'IBM Plex Mono', size:9.5}, maxRotation:0, autoSkip:true }, grid:{ color:gridColor } },
        y:{ position:'left', ticks:{ color:ironColor, font:{family:'IBM Plex Mono', size:10} }, grid:{ color:gridColor }, title:{ display:true, text:'min', color:ironColor, font:{size:10} } },
        y1:{ position:'right', ticks:{ color:ironColor, font:{family:'IBM Plex Mono', size:10} }, grid:{ display:false }, title:{ display:true, text:unit, color:ironColor, font:{size:10} } }
      }
    }
  });
}

/* ---------- History ---------- */
function renderList(){
  const wrap = $('metricList');
  if(metrics.length===0){
    wrap.innerHTML = '<div class="empty"><span class="display">No entries yet</span>Log your first stat above and it\'ll show up here.</div>';
    return;
  }
  const sorted = [...metrics].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const groups = {};
  sorted.forEach(e=>{ (groups[e.date] = groups[e.date]||[]).push(e); });

  wrap.innerHTML = '';
  Object.keys(groups).forEach(date=>{
    const dObj = new Date(date+'T00:00:00');
    const label = dObj.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
    const group = document.createElement('div');
    group.className = 'day-group';
    const head = document.createElement('div');
    head.className = 'day-head';
    head.textContent = date === todayStr() ? 'TODAY \u00b7 ' + label : label;
    group.appendChild(head);

    groups[date].forEach(e=>{
      const row = document.createElement('div');
      row.className = 'entry';
      const parts = [];
      if(e.weight) parts.push(`<span class="dur">${e.weight} ${e.weightUnit||'lb'}</span>`);
      if(e.bodyFat) parts.push(`<span class="sub-metric">${e.bodyFat}% BF</span>`);
      if(e.restingHR) parts.push(`<span class="sub-metric">${e.restingHR} bpm</span>`);
      row.innerHTML = `
        <div class="entry-main">
          <div class="top-line">${parts.join('')}</div>
          ${e.notes ? `<div class="note">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div class="entry-actions">
          <button class="kebab-btn" data-menu="${e.id}">&#8942;</button>
          ${openMenuId===e.id ? `
            <div class="entry-menu">
              <button data-edit="${e.id}">Edit entry</button>
              <button class="danger" data-delete="${e.id}">Delete entry</button>
            </div>
          ` : ''}
        </div>
      `;
      group.appendChild(row);
    });
    wrap.appendChild(group);
  });

  wrap.querySelectorAll('.kebab-btn').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const id = btn.dataset.menu;
      openMenuId = (openMenuId===id) ? null : id;
      renderList();
    };
  });
  wrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      openMenuId = null;
      startEdit(btn.dataset.edit);
    };
  });
  wrap.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const id = btn.dataset.delete;
      openMenuId = null;
      if(confirm('Delete this entry? This can\'t be undone.')){
        deleteEntry(id);
      } else {
        renderList();
      }
    };
  });
}

function startEdit(id){
  const e = metrics.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  $('mDate').value = e.date;
  $('mWeight').value = e.weight || '';
  selectedWeightUnit = e.weightUnit || 'lb';
  $('unitLb').classList.toggle('active', selectedWeightUnit==='lb');
  $('unitKg').classList.toggle('active', selectedWeightUnit==='kg');
  $('mBodyFat').value = e.bodyFat || '';
  $('mRHR').value = e.restingHR || '';
  $('mNotes').value = e.notes || '';
  $('submitBtn').textContent = 'SAVE CHANGES';
  $('editingBanner').style.display = 'flex';
  renderList();
  document.querySelector('main .card').scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEdit(){
  editingId = null;
  $('mWeight').value = '';
  $('mBodyFat').value = '';
  $('mRHR').value = '';
  $('mNotes').value = '';
  $('mDate').value = todayStr();
  $('submitBtn').textContent = 'LOG IT';
  $('editingBanner').style.display = 'none';
}

function render(){
  activityEntries = loadJSON('trainlog_entries', []);
  renderList();
  renderMetricProgress();
  renderCorrelate();
  applyCollapseState();
}

function addEntry(){
  const date = $('mDate').value || todayStr();
  const weight = $('mWeight').value ? Number($('mWeight').value) : null;
  const bodyFat = $('mBodyFat').value ? Number($('mBodyFat').value) : null;
  const restingHR = $('mRHR').value ? Number($('mRHR').value) : null;
  const notes = $('mNotes').value.trim();

  if(weight===null && bodyFat===null && restingHR===null){
    toast('Log at least one stat');
    return;
  }

  if(editingId){
    const idx = metrics.findIndex(e=>e.id===editingId);
    if(idx>-1){
      metrics[idx] = { ...metrics[idx], date, weight, weightUnit:selectedWeightUnit, bodyFat, restingHR, notes };
    }
    editingId = null;
    $('submitBtn').textContent = 'LOG IT';
    $('editingBanner').style.display = 'none';
    toast('Entry updated');
  } else {
    metrics.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      date, weight, weightUnit:selectedWeightUnit, bodyFat, restingHR, notes,
      createdAt: Date.now()
    });
    toast('Entry logged');
  }
  saveJSON('trainlog_metrics', metrics);
  hapticPulse($('submitBtn'));
  render();
  $('mWeight').value = '';
  $('mBodyFat').value = '';
  $('mRHR').value = '';
  $('mNotes').value = '';
  $('mDate').value = todayStr();
}

function deleteEntry(id){
  metrics = metrics.filter(e=>e.id!==id);
  saveJSON('trainlog_metrics', metrics);
  render();
}

function clearAll(){
  if(!confirm('Delete all body metrics data? This cannot be undone.')) return;
  metrics = [];
  saveJSON('trainlog_metrics', metrics);
  render();
  toast('Metrics data cleared');
}

/* ---------- Theme ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('trainlog_theme', theme);
  const btn = $('themeToggle');
  if(btn) btn.innerHTML = theme==='dark' ? '&#127769; Dark' : '&#9728;&#65039; Light';
}
function initTheme(){
  applyTheme(localStorage.getItem('trainlog_theme') || 'dark');
}
$('themeToggle').onclick = ()=>{
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current==='dark' ? 'light' : 'dark');
  render();
};

$('unitLb').onclick = ()=>{
  selectedWeightUnit='lb';
  $('unitLb').classList.add('active'); $('unitKg').classList.remove('active');
  if(!editingId){
    localStorage.setItem('trainlog_unit_weight','lb');
    $('prefLb').classList.add('active'); $('prefKg').classList.remove('active');
  }
};
$('unitKg').onclick = ()=>{
  selectedWeightUnit='kg';
  $('unitKg').classList.add('active'); $('unitLb').classList.remove('active');
  if(!editingId){
    localStorage.setItem('trainlog_unit_weight','kg');
    $('prefKg').classList.add('active'); $('prefLb').classList.remove('active');
  }
};
function setDefaultWeightUnit(u){
  localStorage.setItem('trainlog_unit_weight', u);
  $('prefLb').classList.toggle('active', u==='lb');
  $('prefKg').classList.toggle('active', u==='kg');
  if(!editingId){
    selectedWeightUnit = u;
    $('unitLb').classList.toggle('active', u==='lb');
    $('unitKg').classList.toggle('active', u==='kg');
  }
  toast('Default weight unit set to ' + u);
}
$('prefLb').onclick = ()=> setDefaultWeightUnit('lb');
$('prefKg').onclick = ()=> setDefaultWeightUnit('kg');
$('submitBtn').onclick = addEntry;
$('cancelEditBtn').onclick = cancelEdit;
$('clearAllBtn').onclick = clearAll;
$('mDate').value = todayStr();

document.addEventListener('click', (ev)=>{
  if(openMenuId && !ev.target.closest('.entry-actions')){
    openMenuId = null;
    renderList();
  }
});

function init(){
  initTheme();
  metrics = loadJSON('trainlog_metrics', []);
  selectedWeightUnit = localStorage.getItem('trainlog_unit_weight') || 'lb';
  $('unitLb').classList.toggle('active', selectedWeightUnit==='lb');
  $('unitKg').classList.toggle('active', selectedWeightUnit==='kg');
  $('prefLb').classList.toggle('active', selectedWeightUnit==='lb');
  $('prefKg').classList.toggle('active', selectedWeightUnit==='kg');
  collapsedSections = loadJSON('trainlog_metrics_collapsed', {correlate:true});
  render();
}
init();
</script>
