<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrainLog">
<meta name="theme-color" content="#1B2320">
<title>TrainLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2320;
    --surface:#212B27;
    --surface2:#283330;
    --chalk:#EDE6D6;
    --iron:#8A9490;
    --amber:#E4A93A;
    --run:#C1502E;
    --ride:#E4A93A;
    --swim:#4F8A8B;
    --lift:#A6763A;
    --walk:#7C8C74;
    --hike:#55694A;
    --other:#8A9490;
    --line:rgba(237,230,214,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--chalk);}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:48px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- Scoreboard header ---- */
  header.scoreboard{
    padding:28px 20px 22px;
    background:
      radial-gradient(circle at 15% 0%, rgba(228,169,58,0.10), transparent 55%),
      var(--surface);
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  header.scoreboard::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--amber) 0 14px, transparent 14px 26px);
    opacity:0.5;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px;
  }
  .brand h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:34px; letter-spacing:0.03em; margin:0; line-height:1;
  }
  .brand h1 span{color:var(--amber);}
  .brand .sub{font-size:11px; color:var(--iron); text-transform:uppercase; letter-spacing:0.14em;}

  .stat-row{display:flex; gap:10px;}
  .stat{
    flex:1; background:var(--surface2); border:1px solid var(--line);
    border-radius:10px; padding:12px 10px; text-align:center;
  }
  .stat .num{font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--amber); line-height:1;}
  .stat .lbl{font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--iron); margin-top:4px;}

  /* ---- Form card ---- */
  main{padding:20px; max-width:560px; margin:0 auto;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:22px;
  }
  .card h2{
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.04em;
    margin:0 0 14px; color:var(--chalk);
  }
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 12px; border-radius:8px; border:1.5px solid var(--line);
    background:transparent; color:var(--iron); font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; font-weight:600; letter-spacing:0.05em; cursor:pointer;
  }
  .chip.active{color:var(--ink); border-color:transparent;}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--iron);}
  .field input, .field textarea, .field select{
    background:var(--surface2); border:1px solid var(--line); border-radius:8px;
    color:var(--chalk); font-family:'Inter',sans-serif; font-size:14.5px; padding:9px 10px;
    outline:none; width:100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--amber);}
  .dist-row{display:flex; gap:8px;}
  .dist-row input{flex:1;}
  .unit-toggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .unit-toggle button{
    background:var(--surface2); color:var(--iron); border:none; padding:0 12px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;
  }
  .unit-toggle button.active{background:var(--amber); color:var(--ink); font-weight:600;}
  textarea{resize:vertical; min-height:44px; margin-bottom:14px;}

  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:9px; cursor:pointer;
    background:var(--amber); color:var(--ink); font-family:'Bebas Neue',sans-serif;
    font-size:17px; letter-spacing:0.06em;
  }
  .btn-primary:active{transform:scale(0.99);}

  /* ---- Log list ---- */
  .log h2{
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.04em; margin:0 0 12px;
  }
  .day-group{margin-bottom:18px;}
  .day-head{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em;
    color:var(--iron); text-transform:uppercase; margin-bottom:8px; padding-left:2px;
  }
  .entry{
    position:relative;
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px 12px 16px; margin-bottom:8px;
  }
  .entry::before, .entry::after{
    content:""; position:absolute; left:-1px; width:10px; height:10px;
    background:var(--ink); border-radius:50%; border:1px solid var(--line);
  }
  .entry::before{top:-6px;} .entry::after{bottom:-6px;}
  .entry{border-left:3px dashed var(--type-color, var(--iron));}
  .bib{
    flex:0 0 auto; width:46px; height:32px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    background:var(--type-color, var(--iron)); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.02em;
  }
  .entry-main{flex:1; min-width:0;}
  .entry-main .top-line{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .entry-main .dur{font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600;}
  .entry-main .dist{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--iron);}
  .entry-main .note{font-size:12.5px; color:var(--iron); margin-top:2px; overflow-wrap:anywhere;}
  .del-btn{
    flex:0 0 auto; background:none; border:none; color:var(--iron);
    font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;
  }
  .del-btn:active{color:var(--run);}

  .empty{
    text-align:center; padding:34px 18px; color:var(--iron); font-size:13.5px;
    border:1px dashed var(--line); border-radius:12px;
  }
  .empty .display{display:block; font-size:22px; color:var(--chalk); margin-bottom:6px;}

  footer{
    text-align:center; padding:18px 20px 6px; font-size:11px; color:var(--iron);
  }
  footer button{
    background:none; border:none; color:var(--iron); text-decoration:underline;
    font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--chalk); color:var(--ink); padding:9px 16px; border-radius:20px;
    font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity 0.25s;
    z-index:50;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="scoreboard">
  <div class="brand">
    <h1>TRAIN<span>LOG</span></h1>
    <div class="sub">personal training record</div>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">Day streak</div></div>
    <div class="stat"><div class="num" id="statWeek">0:00</div><div class="lbl">This week</div></div>
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Sessions logged</div></div>
  </div>
</header>

<main>
  <section class="card">
    <h2>Log a session</h2>
    <div class="chip-row" id="typeChips"></div>
    <div class="field-grid">
      <div class="field">
        <label for="fDate">Date</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label for="fDuration">Duration (min)</label>
        <input type="number" id="fDuration" min="0" placeholder="45">
      </div>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Distance (optional)</label>
      <div class="dist-row">
        <input type="number" id="fDistance" min="0" step="0.01" placeholder="e.g. 5.2">
        <div class="unit-toggle">
          <button type="button" id="unitMi" class="active">mi</button>
          <button type="button" id="unitKm">km</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="fNotes">Notes (optional)</label>
      <textarea id="fNotes" placeholder="How it felt, route, weights used..."></textarea>
    </div>
    <button class="btn-primary" id="submitBtn">LOG IT</button>
  </section>

  <section class="log">
    <h2>History</h2>
    <div id="logList"></div>
  </section>
</main>

<footer>
  <span id="footNote">Saved on this device.</span> · <button id="clearAllBtn">Clear all data</button>
</footer>

<div class="toast" id="toast"></div>

<script>
const TYPES = [
  {key:'run',   label:'Run',      code:'RUN',  color:'var(--run)'},
  {key:'ride',  label:'Ride',     code:'RIDE', color:'var(--ride)'},
  {key:'swim',  label:'Swim',     code:'SWIM', color:'var(--swim)'},
  {key:'lift',  label:'Strength', code:'LIFT', color:'var(--lift)'},
  {key:'walk',  label:'Walk',     code:'WALK', color:'var(--walk)'},
  {key:'hike',  label:'Hike',     code:'HIKE', color:'var(--hike)'},
  {key:'other', label:'Other',    code:'OTHR', color:'var(--other)'},
];
const typeMap = Object.fromEntries(TYPES.map(t=>[t.key,t]));

let entries = [];
let selectedType = 'run';
let selectedUnit = 'mi';
let storageOK = true;

const $ = id => document.getElementById(id);

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function renderChips(){
  const row = $('typeChips');
  row.innerHTML = '';
  TYPES.forEach(t=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (t.key===selectedType ? ' active' : '');
    b.textContent = t.code;
    if(t.key===selectedType){ b.style.background = t.color; }
    b.onclick = ()=>{ selectedType = t.key; renderChips(); };
    row.appendChild(b);
  });
}

function fmtHM(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h>0 ? (h + ':' + String(m).padStart(2,'0')) : ('0:' + String(m).padStart(2,'0'));
}

function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay()+6)%7; // Mon=0
  date.setDate(date.getDate()-day);
  date.setHours(0,0,0,0);
  return date;
}

function computeStats(){
  if(entries.length===0){
    $('statStreak').textContent='0';
    $('statWeek').textContent='0:00';
    $('statTotal').textContent='0';
    return;
  }
  const days = new Set(entries.map(e=>e.date));
  let streak = 0;
  let cursor = new Date(todayStr()+'T00:00:00');
  if(!days.has(todayStr())){
    cursor.setDate(cursor.getDate()-1);
  }
  while(days.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  const wkStart = startOfWeek(new Date());
  const weekMins = entries
    .filter(e=> new Date(e.date+'T00:00:00') >= wkStart)
    .reduce((s,e)=> s + (Number(e.duration)||0), 0);

  $('statStreak').textContent = streak;
  $('statWeek').textContent = fmtHM(weekMins);
  $('statTotal').textContent = entries.length;
}

function renderList(){
  const wrap = $('logList');
  wrap.innerHTML = '';
  if(entries.length===0){
    wrap.innerHTML = '<div class="empty"><span class="display">Log is empty</span>Punch in your first session above and it\'ll show up here.</div>';
    return;
  }
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const groups = {};
  sorted.forEach(e=>{ (groups[e.date] = groups[e.date]||[]).push(e); });

  Object.keys(groups).forEach(date=>{
    const dObj = new Date(date+'T00:00:00');
    const label = dObj.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
    const group = document.createElement('div');
    group.className = 'day-group';
    const head = document.createElement('div');
    head.className = 'day-head';
    head.textContent = date === todayStr() ? 'TODAY · ' + label : label;
    group.appendChild(head);

    groups[date].forEach(e=>{
      const t = typeMap[e.type] || typeMap.other;
      const row = document.createElement('div');
      row.className = 'entry';
      row.style.setProperty('--type-color', t.color);
      const distStr = e.distance ? `${e.distance} ${e.unit}` : '';
      row.innerHTML = `
        <div class="bib" style="background:${t.color}">${t.code}</div>
        <div class="entry-main">
          <div class="top-line">
            <span class="dur">${fmtHM(Number(e.duration)||0)}</span>
            ${distStr ? `<span class="dist">${distStr}</span>` : ''}
          </div>
          ${e.notes ? `<div class="note">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <button class="del-btn" data-id="${e.id}">&times;</button>
      `;
      group.appendChild(row);
    });
    wrap.appendChild(group);
  });

  wrap.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = ()=> deleteEntry(btn.dataset.id);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render(){
  computeStats();
  renderList();
}

async function loadEntries(){
  try{
    const res = await window.storage.get('entries', false);
    entries = res ? JSON.parse(res.value) : [];
  }catch(err){
    entries = [];
  }
  render();
}

async function saveEntries(){
  try{
    const res = await window.storage.set('entries', JSON.stringify(entries), false);
    if(!res){ storageOK = false; toast('Could not save — try again'); }
  }catch(err){
    storageOK = false;
    toast('Could not save — try again');
  }
}

async function addEntry(){
  const duration = $('fDuration').value;
  const date = $('fDate').value || todayStr();
  if(!duration || Number(duration) <= 0){
    toast('Add a duration first');
    return;
  }
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    type: selectedType,
    date,
    duration: Number(duration),
    distance: $('fDistance').value ? Number($('fDistance').value) : null,
    unit: selectedUnit,
    notes: $('fNotes').value.trim(),
    createdAt: Date.now()
  };
  entries.push(entry);
  render();
  await saveEntries();
  toast('Session logged');
  $('fDuration').value = '';
  $('fDistance').value = '';
  $('fNotes').value = '';
  $('fDate').value = todayStr();
}

async function deleteEntry(id){
  entries = entries.filter(e=>e.id!==id);
  render();
  await saveEntries();
}

async function clearAll(){
  if(!confirm('Delete all logged sessions? This cannot be undone.')) return;
  entries = [];
  render();
  await saveEntries();
  toast('All data cleared');
}

$('unitMi').onclick = ()=>{ selectedUnit='mi'; $('unitMi').classList.add('active'); $('unitKm').classList.remove('active'); };
$('unitKm').onclick = ()=>{ selectedUnit='km'; $('unitKm').classList.add('active'); $('unitMi').classList.remove('active'); };
$('submitBtn').onclick = addEntry;
$('clearAllBtn').onclick = clearAll;
$('fDate').value = todayStr();

renderChips();
loadEntries();
</script>
</body>
</html>
